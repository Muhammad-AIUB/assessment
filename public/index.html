<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaStock</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <h1>PharmaStock</h1>
      <p class="muted">Batch, expiry &amp; demand-aware stock for small pharmacies</p>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Log in</button>
      <p class="error" id="login-error"></p>
      <p class="muted small">Demo: <code>owner / owner123</code> · <code>staff / staff123</code></p>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <header class="topbar">
      <div class="brand">PharmaStock</div>
      <nav id="nav"></nav>
      <div class="who"><span id="who"></span> <span id="today" class="muted small"></span> <button id="logout" class="ghost">Log out</button></div>
    </header>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
